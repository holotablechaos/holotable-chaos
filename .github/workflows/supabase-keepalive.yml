name: Supabase Keep-Alive

# Supabase pauses free projects after a week without activity. Every two days this calls the
# public keep_alive() function with the publishable key that is already public in
# assets/js/supabase-config.js. It uses no secrets. If the project is paused or unreachable,
# the run fails so GitHub emails the repository owner.

on:
  schedule:
    - cron: "17 9 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site configuration
        uses: actions/checkout@v6
        with:
          sparse-checkout: assets/js/supabase-config.js
          sparse-checkout-cone-mode: false
      - name: Call keep_alive()
        run: |
          config=assets/js/supabase-config.js
          url=$(sed -nE 's/^[[:space:]]*url:[[:space:]]*"([^"]*)".*/\1/p' "$config")
          key=$(sed -nE 's/^[[:space:]]*publishableKey:[[:space:]]*"([^"]*)".*/\1/p' "$config")
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Accounts are not configured yet; nothing to keep alive." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 60 -X POST "$url/rest/v1/rpc/keep_alive" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}') || status=000
          if [ "$status" != "200" ]; then
            echo "::error::Supabase keep-alive failed with HTTP $status. The project may be paused: open the Supabase dashboard and restore it."
            head -c 500 response.txt || true
            exit 1
          fi
          echo "Supabase answered at $(cat response.txt)." | tee -a "$GITHUB_STEP_SUMMARY"
